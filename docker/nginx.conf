server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 16k;
  location = /healthz { default_type text/plain; return 200 'ok'; }
  location = /api/newsletter/subscribe {
    proxy_pass https://listmonk.rogpe.tech/api/public/subscription;
    proxy_http_version 1.1;
    proxy_set_header Host listmonk.rogpe.tech;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location ~* \.(?:css|js|png|svg)$ {
    try_files $uri =404;
    expires 7d;
  }
  error_page 404 /404.html;
  location = /404.html { internal; }
  location / { try_files $uri $uri/ $uri/index.html =404; }
}
